<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 205 285" width="205" height="285" class="card-pack-thumbnail"><style>

.card-pack-shell,
.card-pack-thumbnail {
  --card-pack-frame-color: #122437;
  --card-pack-inner-frame-color: #ffd977;
  --card-pack-inner-shadow-color: rgba(80, 13, 27, .42);
  --card-pack-color-yellow: #f8d65f;
  --card-pack-color-orange: #ef7728;
  --card-pack-color-red: #d73526;
  --card-pack-color-deep-red: #8e1f2b;
}


.card-pack-master-shine {
  fill: rgba(255, 238, 169, 0.13);
}


.card-pack-master-bottom {
  fill: var(--card-pack-bottom, #64192a);
}


.card-pack-master-left-fold {
  fill: rgba(255, 238, 169, 0.28);
}


.card-pack-master-right-fold {
  fill: rgba(55, 8, 22, 0.3);
}


.card-pack-master-top-crimp,
.card-pack-master-bottom-crimp {
  fill: none;
  stroke-linecap: square;
  vector-effect: non-scaling-stroke;
}


.card-pack-master-top-crimp {
  stroke: rgba(102, 28, 30, 0.2);
  stroke-width: 2px;
}


.card-pack-master-bottom-crimp {
  stroke: rgba(255, 207, 94, 0.28);
  stroke-width: 2px;
}


.card-pack-master-copy {
  fill: var(--card-pack-paper, #fff4c9);
  stroke: var(--card-pack-ink, #5b1723);
  stroke-linejoin: round;
  text-anchor: middle;
  paint-order: stroke;
}


.card-pack-master-kicker {
  stroke-width: 2px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.8px;
}


.card-pack-master-logo {
  stroke-width: 3px;
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -1px;
}


.card-pack-master-count {
  stroke-width: 2px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.7px;
}


.card-pack-master-emblem-shadow {
  fill: rgba(67, 12, 26, 0.5);
}


.card-pack-master-emblem-outer {
  fill: var(--card-pack-emblem, #ffd75d);
  stroke: #3e1320;
  stroke-width: 4px;
}


.card-pack-master-emblem-inner {
  fill: #fff0a1;
  stroke: #7a2030;
  stroke-width: 4px;
}


.card-pack-master-outer-frame,
.card-pack-master-inner-frame,
.card-pack-master-shadow-frame,
.card-pack-master-bottom-stitch {
  fill: none;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}


.card-pack-master-outer-frame {
  stroke: var(--card-pack-frame-color);
  stroke-width: 3px;
}


.card-pack-master-inner-frame {
  stroke: var(--card-pack-inner-frame-color);
  stroke-width: 2px;
}


.card-pack-master-shadow-frame {
  stroke: var(--card-pack-inner-shadow-color);
  stroke-width: 3px;
}


.card-pack-master-bottom-stitch {
  stroke: #d88d46;
  stroke-width: 2px;
  stroke-dasharray: 7 5;
}


.card-pack-sealed-perforation {
  fill: none;
  stroke: #ffe077;
  stroke-width: 2px;
  stroke-dasharray: 7 5;
  stroke-linecap: butt;
  vector-effect: non-scaling-stroke;
}
